{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>
            {% if item %}
                Edit Item
            {% else %}
                Add Item
            {% endif %}
        </h3>

        <a href="/items/" class="btn btn-secondary">
            Back
        </a>
    </div>

    <form method="post"
          action="{% if item %}/items/{{ item.id }}/update{% else %}/items/create{% endif %}">

        <div class="card mb-3">
            <div class="card-header">
                <strong>General Information</strong>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Item Name</label>

                        <input
                            type="text"
                            class="form-control"
                            name="item_name"
                            value="{{ item.item_name if item else '' }}"
                            required>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Item Type</label>

                        <select class="form-select" name="item_type">

                            <option value="Product"
                                {% if item and item.item_type=="Product" %}selected{% endif %}>
                                Product
                            </option>

                            <option value="Service"
                                {% if item and item.item_type=="Service" %}selected{% endif %}>
                                Service
                            </option>

                        </select>
                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label">Inventory Managed</label>

                        <select class="form-select" name="inventory_managed">

                            <option value="true"
                                {% if not item or item.inventory_managed %}selected{% endif %}>
                                Yes
                            </option>

                            <option value="false"
                                {% if item and not item.inventory_managed %}selected{% endif %}>
                                No
                            </option>

                        </select>

                    </div>

                </div>

            </div>
        </div>

        <div class="card mb-3">

            <div class="card-header">
                <strong>Classification</strong>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Category</label>
                       <div class="mb-3">
    <label class="form-label">Category</label>

    <select
       <div class="col-md-3 mb-3">

    <label class="form-label">Category</label>

    <select
        class="form-select"
        name="category"
    >

        <option value="">Select Category</option>

        {% for category in categories %}

        <option
            value="{{ category.category_name }}"
            {% if item and item.category == category.category_name %}
                selected
            {% endif %}
        >
            {{ category.category_name }}
        </option>

        {% endfor %}

    </select>

</div>
    </select>
</div>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Unit</label>
                        <input type="text"
                               class="form-control"
                               name="unit"
                               value="{{ item.unit if item else '' }}">
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">HSN / SAC</label>
                        <input type="text"
                               class="form-control"
                               name="hsn_sac"
                               value="{{ item.hsn_sac if item else '' }}">
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">GST %</label>
                        <input type="number"
                               step="0.01"
                               class="form-control"
                               name="gst_percent"
                               value="{{ item.gst_percent if item else 0 }}">
                    </div>

                </div>

            </div>

        </div>

        <div class="card mb-3">

            <div class="card-header">
                <strong>Pricing</strong>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Cost Price</label>

                        <input type="number"
                               step="0.01"
                               class="form-control"
                               name="cost_price"
                               value="{{ item.cost_price if item else 0 }}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Selling Price</label>

                        <input type="number"
                               step="0.01"
                               class="form-control"
                               name="selling_price"
                               value="{{ item.selling_price if item else 0 }}">
                    </div>

                </div>

            </div>

        </div>

        <div class="card mb-4">

            <div class="card-header">
                <strong>Description</strong>
            </div>

            <div class="card-body">

                <textarea
                    class="form-control"
                    rows="4"
                    name="description">{{ item.description if item else '' }}</textarea>

            </div>

        </div>

        <button class="btn btn-primary">
            {% if item %}
                Update Item
            {% else %}
                Save Item
            {% endif %}
        </button>

        <a href="/items/" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
