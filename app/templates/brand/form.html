{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h3>
                {% if brand %}
                    Edit Brand
                {% else %}
                    Add Brand
                {% endif %}
            </h3>
            <p class="text-muted mb-0">
                Manage Product Brands
            </p>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header">
            <strong>Brand Information</strong>
        </div>

        <div class="card-body">

            <form method="post"
                  action="{% if brand %}/brands/{{ brand.id }}/update{% else %}/brands/create{% endif %}">

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Brand Code</label>
                        <input
    				type="text"
    				name="brand_code"
    				class="form-control"
    				value="{{ brand.brand_code if brand else '' }}"
    				required>
                    </div>

                    <div class="col-md-8 mb-3">
                        <label class="form-label">Brand Name</label>
                        <input
                            type="text"
                            name="brand_name"
                            class="form-control"
                            value="{{ brand.name if brand else '' }}"
                            required>
                    </div>

                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="3">{{ brand.description if brand else '' }}</textarea>
                </div>

                {% include "components/form_buttons.html" %}

            </form>

        </div>
    </div>

</div>

{% endblock %}
