{% extends "base.html" %}

{% block content %}

<h3 class="mb-4">{{ title }}</h3>

<form
    method="post"
    action="{% if is_edit %}/categories/{{ category.id }}/update{% else %}/categories/create{% endif %}"
>

<div class="mb-3">
    <label class="form-label">
        Category Name
    </label>

    <input
        type="text"
        name="category_name"
        class="form-control"
        value="{{ category.category_name if is_edit else '' }}"
        required
    >
</div>

<div class="mb-3">
    <label class="form-label">
        Description
    </label>

    <textarea
        name="description"
        class="form-control"
        rows="3"
    >{{ category.description if is_edit else '' }}</textarea>
</div>

<button
    type="submit"
    class="btn btn-success"
>
    Save
</button>

<a
    href="/categories/"
    class="btn btn-secondary"
>
    Cancel
</a>

</form>

{% endblock %}
