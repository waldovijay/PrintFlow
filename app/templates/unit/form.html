{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h3>
            {% if unit %}
                Edit Unit
            {% else %}
                Add Unit
            {% endif %}
        </h3>

        <a href="/units/" class="btn btn-secondary">
            Back
        </a>

    </div>

    <form method="post"
          action="{% if unit %}/units/{{ unit.id }}/update{% else %}/units/create{% endif %}">

        <div class="card">

            <div class="card-header">
                <strong>Unit Information</strong>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Unit Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="unit_name"
                            value="{{ unit.unit_name if unit else '' }}"
                            required>

                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label">
                            Short Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="short_name"
                            value="{{ unit.short_name if unit else '' }}"
                            required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-12 mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            class="form-control"
                            rows="3"
                            name="description">{{ unit.description if unit else '' }}</textarea>

                    </div>

                </div>

            </div>

        </div>

        <div class="mt-3">

        {% set cancel_url = "/units/" %}

	{% include "components/form_buttons.html" %}

        </div>

    </form>

</div>

{% endblock %}
