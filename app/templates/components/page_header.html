<div class="d-flex justify-content-between align-items-center mb-4">

    <div>
        <h3 class="mb-1">{{ page_title }}</h3>

        {% if page_subtitle %}
        <p class="text-muted mb-0">{{ page_subtitle }}</p>
        {% endif %}
    </div>

    <div>
        {% if back_url %}
        <a href="{{ back_url }}" class="btn btn-outline-secondary me-2">
            ← Back
        </a>
        {% endif %}

        {% if add_url %}
        <a href="{{ add_url }}" class="btn btn-primary">
            + Add New
        </a>
        {% endif %}
    </div>

</div>

<hr class="mb-4">
